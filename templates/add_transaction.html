{% extends 'base.html' %}

{% block title %}Add Transaction - Finance Tracker{% endblock %}

{% block content %}
<div class="form-container">
    <h2>Add New Transaction</h2>
    <form method="POST" action="{{ url_for('add_transaction') }}">
        <div>
            <label for="title">Title:</label>
            <input type="text" id="title" name="title" placeholder="e.g. Grocery shopping" required>
        </div>

        <div>
            <label for="amount">Amount ($):</label>
            <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
        </div>

        <div>
            <label for="type">Type:</label>
            <select id="type" name="type" required>
                <option value="expense">Expense</option>
                <option value="income">Income</option>
            </select>
        </div>

        <div>
            <label for="category">Category:</label>
            <input type="text" id="category" name="category" placeholder="e.g. Food, Salary, Rent" required>
        </div>

        <div>
            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>
        </div>

        <div>
            <label for="notes">Notes:</label>
            <textarea id="notes" name="notes" placeholder="Optional notes..."></textarea>
        </div>

        <button type="submit">Add Transaction</button>
        <a href="{{ url_for('index') }}">Cancel</a>
    </form>
</div>

<script>
    // Automatically set today's date
    document.getElementById('date').valueAsDate = new Date();
</script>
{% endblock %}
