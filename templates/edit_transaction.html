{% extends 'base.html' %}

{% block title %}Edit Transaction - Finance Tracker{% endblock %}

{% block content %}

<h2>Edit Transaction</h2>

<form method="POST" action="{{ url_for('edit_transaction', id=transaction['id']) }}">


<div>
    <label for="title">Title:</label>
    <input type="text" id="title" name="title" value="{{ transaction['title'] }}" required>
</div>

<div>
    <label for="amount">Amount:</label>
    <input type="number" id="amount" name="amount" step="0.01" min="0.01" value="{{ transaction['amount'] }}" required>
</div>

<div>
    <label for="type">Type:</label>
    <select id="type" name="type" required>
        <option value="expense" {% if transaction['type'] == 'expense' %}selected{% endif %}>
            Expense
        </option>

        <option value="income" {% if transaction['type'] == 'income' %}selected{% endif %}>
            Income
        </option>
    </select>
</div>

<div>
    <label for="category">Category:</label>
    <input type="text" id="category" name="category" value="{{ transaction['category'] }}" required>
</div>

<div>
    <label for="date">Date:</label>
    <input type="date" id="date" name="date" value="{{ transaction['date'] }}" required>
</div>

<div>
    <label for="notes">Notes:</label>
    <textarea id="notes" name="notes">{{ transaction['notes'] }}</textarea>
</div>

<button type="submit">Update Transaction</button>


</form>

{% endblock %}
